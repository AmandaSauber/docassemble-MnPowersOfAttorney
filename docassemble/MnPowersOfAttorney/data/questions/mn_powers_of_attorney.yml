comment: |
  This question is used to introduce your interview. Please customize
id: Powers_of_Attorney
continue button field: mn_powers_of_attorney_intro
question: |
  Powers of Attorney
subquestion: |
  This interview will help you give powers of attorney to a trusted person. The person you give power to is called the "Attorney-in-Fact". This person will act for you and as you when using the Power of Attorney. 
  
  Legally, when your Attorney-in-Fact acts for you, it's the same as if you were acting for yourself.
  
  Before you get started, you should: 

  1. Read about [Powers of Attorney](https://www.lawhelpmn.org/self-help-library/fact-sheet/powers-attorney) to understand how much power it gives.
  
  2. Read about [stopping a Power of Attorney](https://www.lawhelpmn.org/self-help-library/fact-sheet/powers-attorney) should you need to do so.
  
  3. Read and understand the difference between a [Durable Power of Attorney](https://www.lawhelpmn.org/self-help-library/fact-sheet/powers-attorney) and a [Health Care Directive](https://www.lawhelpmn.org/self-help-library/fact-sheet/health-care-directives).
  
  4. Gather the following:
  
      - The name and address of the person or people you trust and want to give power over your finances.
      - The _legal description_ of any property you want to give the person you trust authority over.
  
  The interview will help you decide which powers to give to your "attorney-in-fact."
  
  When you are finished, you will need to:
  
  1. Sign the powers of attorney form in front of a notary.
  
  2. Give copies of the powers of attorney form to the person you are giving power and to the bank or anywhere else you want the person to be allowed to make decisions for you.
  
  Most people take about 20 minutes to finish this interview.
---
id: can i get a power of attorney
question: |
  Can I get a power of attorney?
subquestion: |
  You can use this form to give power over your own decision making,
  or someone else can fill it in for the person who is giving power over their
  decision making.

  This question is about the person who is giving the power over their decision
  making, regardless of who is filling out this form.

  Is the person wanting to **give** power to someone else:
fields:
  - Living in Minnesota?: grantor_lives_in_minnesota
    datatype: yesnoradio
  - Over 18?: grantor_over_18
    datatype: yesnoradio
  - Able to make their own decisions about **giving** power to someone else?: grantor_competent
    datatype: yesnoradio
    help: |
      A Power of Attorney can only be made for a legally competent adult.
      
      'Legally competent' means the person wanting to give power to someone else must have the ability to reason and make sound decisions, and must fully understand their actions in signing this form.
---
id: exit cannot get poa
event: exit_cant_get_poa
decoration: hand
question: |
  You cannot get a power of attorney
subquestion: |
  Before anyone can use this interview to get a powers of attorney form,
  the person giving power over their decision making must be:

  1. Living in Minnesota
  1. Over 18, and
  1. Able to make the decision about giving power to someone else right now (competent)

  'Legally competent' means the person wanting to give power to someone else must have the ability to reason and make sound decisions, and must fully understand their actions in signing this form.

  % if not grantor_lives_in_minnesota:
  You said the person giving
  power over their decision making does not live in Minnesota.

  % endif
  % if (not grantor_over_18) and (not grantor_competent):
  You said that the person giving power over their decision making is both under the age of 18
  and not competent to make this decision.
  % elif not grantor_over_18:
  You said the person giving power is not over 18.
  % elif not grantor_competent:
  You said the person giving power is not competent to make this decision.
  % endif

  You cannot use this website to complete a powers of attorney form.
  You may want to read about [other legal options](https://www.lawhelpmn.org/self-help-library/planning-ahead-elder-law) on the LawHelpMN website.
buttons:
  - Leave: exit
    url: https://www.lawhelpmn.org/self-help-library/planning-ahead-elder-law
---
id: who answering
question: |
  Are you the person who will be **giving** power over your own decision making?
subquestion: |
  In a Power of Attorney, the "Principal" is the person who names someone else to help handle legal and financial matters.
fields:
  - I am: person_answering
    datatype: radio
    choices:
      - The person **giving** power over my decisions: myself
      - Someone else, like an attorney or helper: drafter
  - note: |
      **OK**, write **your own** name and address below. On the next screen, we will
      ask for the name of the person you are helping.
    show if:
      variable: person_answering
      is: drafter
  - code: |
      drafter.name_fields(show_if={"variable": "person_answering", "is": "drafter"})
  - code: |
      drafter.address_fields(show_if={"variable": "person_answering", "is": "drafter"})
---
id: your name
sets:
    - users[0].name.first
    - users[0].name.last
    - users[0].name.middle
    - users[0].name.suffix
question:  |
  % if person_answering == "drafter":
  What is the name of the person you are helping?
  % else:
  What is your name?
  % endif
fields:
  - code: |
      users[0].name_fields()
---
id: your address
sets:
  - users[0].address.address
  - users[0].address.city
  - users[0].address.zip
  - users[0].address.unit
  - users[0].address.state
  - users[0].address.country
question: |
  % if person_answering == "drafter":
  What is the permanent address of the person you are helping?
  % else:
  What is your permanent address?
  % endif
fields:
  - code: |
      users[0].address_fields(country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE)
validation code: |
  if not users[0].address.state == "MN":
    validation_error("The power of attorney must be for someone who lives in Minnesota", field="users[0].address.state")
---
id: decision maker signpost
continue button field: decision_maker_signpost
question: |
  About the decision makers you can name
subquestion: |
  You can name two kinds of decision makers on this website:

  1. People who can make decisions for you now. This kind of person is called
     an attorney-in-fact. And,
  
  1. People who can only make decisions for you if the first people
     are no longer able to do so, called successors.

  You can also decide if the people who make decisions for you need to
  agree on each decision before they make it or if they can act on their own.

  If you are planning to name more than one person on this website,
  take a minute to decide what job each person will have. Do you want
  them to make decisions right away, or only if the first choice
  decision maker cannot?

  We will explain more about each kind of decision maker when we ask
  for their names.
---
id: name of the first attorney in fact
sets:
  - attorneys[0].name.first
  - attorneys[0].name.last
  - attorneys[0].name.middle
  - attorneys[0].name.suffix
question: |
  % if person_answering == "drafter":
  Who will ${ users[0] } give power over their decisions right now?
  % else:
  Who do you want to give power over your decisions right now?
  % endif
subquestion: |
  The person that you name is called an "attorney-in-fact" in Minnesota.
  
  We will ask you later if you want to name more than one person.

  You can name more than one person who will make decisions for you now. You can also
  name backup decision makers who will only make decisions if the other person or
  people are no longer able to.
fields:
  - code: |
      attorneys[0].name_fields()
  - An existing address: attorneys[0].address
    datatype: object_radio
    choices: |
      [users[0].address]
    none of the above: A new address      
  - code: |
      attorneys[0].address_fields(country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE, show_if={"variable": "attorneys[0].address", "is": None})
---
id: another attorney in fact
question: |
  Do you want to name another decision maker?
subquestion: |
  So far you have named ${ attorneys.complete_elements() }
fields:
  - no label: attorneys.there_is_another
    datatype: yesnoradio
---
id: name of the nth attorney in fact
sets:
  - attorneys[i].name.first
  - attorneys[i].name.last
  - attorneys[i].name.middle
  - attorneys[i].name.suffix
question: |
  % if person_answering == "drafter":
  Who else do you want to name who can make decisions for ${ users.familiar() } right now?
  % else:
  Who else do you want to give power to make decisions for you right now?
  % endif
subquestion: |
  So far you have named ${ attorneys.complete_elements() }
fields:
  - code: |
      attorneys[i].name_fields()
  - An existing address: attorneys[i].address
    datatype: object_radio
    choices: |
      [users[0].address] + [attorney.address for attorney in attorneys.complete_elements()]
    none of the above: A new address      
  - code: |
      attorneys[i].address_fields(country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE, show_if={"variable": "attorneys[i].address", "is": None})
---
id: any successors
question: |
  Do you want to name any **backup** decision makers?
subquestion: |
  % if attorneys.number() > 1:
  The people you name as **backup**, called the **successor** attorney-in-fact,
  will only be able to make decisions if ${ attorneys.familiar() } are not able to.
  % else:
  The person you name as **backup**, called the **successor** attorney-in-fact, will only be able to make decisions if ${ attorneys.familiar() } is not able to.
  % endif

  Most people name at least one backup decision maker.

  We will ask you later if you want to name more than one person.
fields:
  - Name backup decision makers?: successor_attorneys.there_are_any
    datatype: yesnoradio
---
id: name of the first successor attorney in fact
sets:
  - successor_attorneys[0].name.first
  - successor_attorneys[0].name.last
  - successor_attorneys[0].name.middle
  - successor_attorneys[0].name.suffix
question: |
  % if person_answering == "drafter":
  Who will ${ users[0] } name as the first backup decision maker?
  % else:
  Who do you want to name as the first backup decision maker?
  % endif
fields:
  - code: |
      successor_attorneys[0].name_fields()
  - An existing address: successor_attorneys[0].address
    datatype: object_radio
    choices: |
      [users[0].address]
    none of the above: A new address      
  - code: |
      successor_attorneys[0].address_fields(country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE, show_if={"variable": "successor_attorneys[0].address", "is": None})
---
id: another successor attorney in fact
question: |
  Do you want to add another **backup** decision maker?
subquestion: |
  So far you have listed ${ successor_attorneys.complete_elements() }
fields:
  - no label: successor_attorneys.there_is_another
    datatype: yesnoradio
---
id: name of the nth successor attorney in fact
sets:
  - successor_attorneys[i].name.first
  - successor_attorneys[i].name.last
  - successor_attorneys[i].name.middle
  - successor_attorneys[i].name.suffix
question: |
  % if person_answering == "drafter":
  Who else do you want to add as a backup decision maker?
  % else:
  Who else do you want to add as a backup decision maker?
  % endif
subquestion: |
  So far you have named ${ successor_attorneys.complete_elements() }
fields:
  - code: |
      successor_attorneys[i].name_fields()
  - An existing address: successor_attorneys[i].address
    datatype: object_radio
    choices: |
      [users[0].address] + [attorney.address for attorney in successor_attorneys.complete_elements()]
    none of the above: A new address      
  - code: |
      successor_attorneys[i].address_fields(country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE, show_if={"variable": "successor_attorneys[i].address", "is": None})

---
id: How long do you want the power of attorney to last
question: |
  How long do you want the power of attorney to last?
fields:
  - How long will the power of attorney last?: expiration_choice
    datatype: radio
    choices:
      - Limited time: Limited time
      - Never expires: Unlimited time
  - "The power of attorney expires on": poa_expiration_date
    datatype: ThreePartsDate
    show if:
      variable: expiration_choice
      is: "Limited time"
  - "The power of attorney should continue if I am incapacitated": is_durable_poa
    datatype: yesno
    help: |
      This is called Durable Powers of Attorney.

      Durable Powers of Attorney let your Attorney-in-Fact act for you even if you become mentally incompetent and cannot make decisions on your own.
---
id: independent authority
question: |
  % if person_answering == "drafter":
  Will each named person be able to make decisions for ${ users.familiar() }
  at the same time?
  % else:
  Will each named person be able to make decisions for you at the same time?
  % endif
subquestion: |
  % if person_answering == "drafter":
  If you make the decision making **independent** then each named person can
  make decisions for ${ users.familiar() } on their own.

  If you do not make the decision making independent, ${ attorneys } will need to 
  agree about each decision they make about ${ users.familiar() }'s finances.
  % else:
  If you make the decision making **independent** then each named person can
  make decisions for you on their own.

  If you do not make the decision making independent, ${ attorneys } will need to 
  agree about each decision they make about your finances.
  % endif
fields:
  - I want: aif_acts_independently  
    datatype: radio
    choices:
      - ${ attorneys.familiar() } to agree about each decision: False
      - ${ attorneys.familiar() } to each be able to make their own decisions: True
---
depends on: expiration_choice
code: |
  poa_expires = expiration_choice == "Limited time"
---
id: What can the power of attorney decide for you
question: |
  % if person_answering == "drafter":
  What can the people you name decide for ${ users.familiar() }?
  % else:
  What can the people you name decide for you?
  % endif
subquestion: |
  The attorneys-in-fact that I name will be able to make decisions about: (click the :circle-question: icon to learn more)
fields:
  - "Real estate": power_real_estate
    datatype: yesnoradio
    help: |
      If you grant this power, ${ attorneys.familiar() } will be able to enter
      into all kinds of real estate transactions in your name.
      
      This includes the power to buy, sell, lease, change and manage property, 
      as well as "any other act with respect to any estate or interest in 
      real property."
      
      You can limit this power to specific properties in Minnesota.
  - Limit to specific properties: real_estate_limited
    datatype: yesno
    show if: power_real_estate
    help: |
      If you choose "yes" we will ask about the specific properties later.
  - "Buy and sell my personal property": power_tangible_property
    datatype: yesnoradio
    help: |
      "Tangible" property is any property that you can touch - not counting 
      real estate like buildings and land. 
      
      For example, a car is tangible, while stocks, bonds and copyrights are not.
      
      If you grant this power, ${ attorneys.familiar() } will be able to enter into
      all kinds of transactions regarding your tangible personal property.
      
      This includes the power to buy, sell, lease, change and manage property, as well as "any other acts with respect to any tangible personal property or interest 
      in any tangible personal property."
  - "Bond, share and commodity transactions": power_bond_share_commodity
    datatype: yesnoradio
    help: |
      If you grant this power, ${ attorneys.familiar() } will be able to conduct all kinds of transactions regarding bonds, shares, and commodities.
      
      If you own bonds, shares, or commodities, ${ attorneys.familiar() } could sell them. If you do not, ${ attorneys.familiar() } could buy some.
      
      This includes the power to buy, sell, transfer, and manage bonds, shares and commodities, as well as "any other acts with respect to any interest in any bond, share, other instrument of similar character, commodity, or instrument with respect to a commodity."
  - "Control over my bank accounts": power_banking
    datatype: yesnoradio
    help: |
      If you grant this power, ${ attorneys.familiar() } will have the same power to handle your bank accounts as you do. This includes the power to:
      
        - open, close or change accounts in your name,
        - withdraw and deposit money,
        - apply for credit and borrow money at interest,
        - get and handle statements,
        - access any safe deposit boxes you may have,
        - and much more.
        
      ${ attorneys.familiar() } will be able to do "any other acts in connection with any banking transaction which does or might in any way affect the financial or other interests of the principal."   
  - "Help run my business": power_business
    datatype: yesnoradio
    help: |
      If you grant this power, ${ attorneys.familiar() } will have the same power as you have over your business. If you are a partner in a business, this includes any power (or duty) you have under the partnership agreement.	If you own a business, this includes power over:
        
        - the name and form of organization of your business,
        - business contracts (including employment contracts),
        - business operating sites and locations,
        - manufacturing, selling, merchandising, financing, accounting, advertising, and insurance,
        - partnership agreements, including the power to enter into new partnership agreements,
      - and much more.
        
      This also includes "any other act which the attorney-in-fact deems desirable or necessary for the furtherance or protection of the interests of the principal in any business."       
  - "Buy or change insurance": power_insurance
    datatype: yesnoradio
    help: |
      If you grant this power, ${ attorneys.familiar() } will be able to handle all kinds of insurance transactions in your name. This includes the power to:
      
        - purchase new insurance contracts including health, life, accident, and disability insurance,
        - end or change any existing insurance contract,
        - make insurance claims,
        - manage the money from any insurance settlement,
        - and much more.
        
      In addition, these powers include "any other acts in connection with procuring, supervising, managing, modifying, enforcing, and terminating contracts of insurance..."
  - "Beneficiary transactions": power_beneficiaries
    datatype: yesnoradio
    help: |
      If you grant this power, ${ attorneys.familiar() } will be able to "represent and act for you in all ways and in all matters" affecting any:
      
        - trust or probate estate,
        - guardianship or conservatorship,
        - escrow,
        - custodianship,
        - qualified or non-qualified benefit plan,
        - individual retirement asset,
        - or any other fund which you are (or claim to be) entitled to receive payment from as a beneficiary or participant.
      
      This includes the power to accept, reject, pledge or demand payment from any such fund. In addition, Test L Test will be able to do "any other act" with regard to any of the types of funds listed above.
  - "Gift transactions": power_gifts
    datatype: yesnoradio
    help: |
      If you grant this power, ${ attorneys.familiar() } will be able to give any type of gift in your name. This includes the power to:
      
        - give gifts of up to $10,000 to your spouse, descendants and other family members, for tax purposes and other purposes
        - give gifts to charities and businesses you have given to in the past
        - perform "any other acts which the attorney-in-fact deems desirable or necessary to complete any gift on behalf of the principal."
  - "Fiduciary transactions": power_fiduciary
    datatype: yesnoradio
    help: |
      If you grant this power, ${ attorneys.familiar() } will have the same powers you have (or may have in the future) as a fiduciary for any fund.
      
      This includes the power to "represent and act for you in all ways and in all matters affecting any fund with respect to which you are a fiduciary."  
  - "Lawsuits and legal claims": power_claims
    datatype: yesnoradio
    help: |
      If you grant this power, ${ attorneys.familiar() } will be able to handle any kind of legal dispute or action on your behalf. This includes:
      
        - asserting and defending against claims before courts, administrative boards, departments, commissioners and tribunals,
        - paying judgments or receiving settlement money
        - hiring any attorney to represent your interests in a legal dispute
        - appearing for you in bankruptcy court
        
      This also includes to power to perform "any other acts in connection with any claim by or against you or with litigation to which you are or may become or be designated a party."
  - "Provide for my family": power_family
    datatype: yesnoradio
    help: |
      If you grant this power, ${ attorneys.familiar() } will be able to make decisions about the care of your family in the same way you would.
      
      This power includes taking any action needed for medical care and to maintain your family's standard of living, as well as:
      
        - the power to use any of your assets to perform this power, including taking money from your bank accounts or selling any of your assets
        - the power to take and use any money (or other assets) that you would get, like salary, wages, stock dividends or other payments
        
      This also includes the power to "do any other acts for the welfare of the spouse, children, or other persons customarily supported by the principal or for the preservation and maintenance of the other personal relationships of the principal to parents, relatives, friends, and organizations as are appropriate."   
  - "Military benefits": power_military_benefits
    datatype: yesnoradio
    help: |
      If you grant this power, ${ attorneys.familiar() } will have the same powers you have in making decisions about any benefits from military service you may receive. This includes the power to:
      
        - sign any vouchers for benefits or reimbursements you may get as a result of military service
        - take possession and control of any property you have in storage
        - file claims for military benefits on your behalf
        - handle any disputes regarding your claims for military benefits
        
      This also includes the power to perform "any other acts which the attorney-in-fact deems desirable or necessary, to assure the principal, and to the dependents of the principal, the maximum possible benefit from the military service performed prior to or after the execution of the power of attorney..."      
  - "Records, reports and statements": power_records
    datatype: yesnoradio
    help: |
      If you grant this power, ${ attorneys.familiar() } will be able to keep track of money and assets you get and pay out. It also includes the power to:
        
        - keep track of any debts you owe or are owed
        - prepare and file all of your tax returns
        - file petitions to the Tax Court on your behalf (for example, to ask for time extensions or to claim you are being taxed unfairly)
        - handle all paperwork needed for protecting your interests in any property
      
      In addition, this also includes the power to "do any other acts in connection with the preparation, execution, filing, storage, or other use of any records, reports, or statements of or concerning your affairs."

continue button field: What_can_the_power_of_attorney_decide_for_you
---
code: |
  selected_powers = []

  if power_real_estate:
      selected_powers.append("Real estate")
  if power_tangible_property:
      selected_powers.append("Personal property")
  if power_bond_share_commodity:
      selected_powers.append("Bond, share and commodity transactions")
  if power_banking:
      selected_powers.append("Banking")
  if power_business:
      selected_powers.append("Business operations")
  if power_insurance:
      selected_powers.append("Insurance")
  if power_beneficiaries:
      selected_powers.append("Beneficiary transactions")
  if power_gifts:
      selected_powers.append("Gift transactions")
  if power_fiduciary:
      selected_powers.append("Fiduciary transactions")
  if power_claims:
      selected_powers.append("Lawsuits and legal claims")
  if power_family:
      selected_powers.append("Family support")
  if power_military_benefits:
      selected_powers.append("Military benefits")
  if power_records:
      selected_powers.append("Records, reports and statements")

  selected_powers_text = comma_and_list(selected_powers)
---
code: |
  if len(selected_powers) == 0:
      power_all_above_label = "Continue without granting any powers?"
  else:
      power_all_above_label = f"Do you mean to give {attorneys.familiar()} power over all of your decision making?"
---
id: power all above
question: |
  <h2 class="h4">Do you want to grant the following powers?</h2>

  % if len(selected_powers) == 0:
  You did not select any powers for your attorney-in-fact.

  Is this correct?
  % else:
  You selected the following powers: ${ selected_powers_text }.

  Is this correct?
  % endif

field: power_all_above # do I need this?
buttons:
  - Confirm and continue
---
id: What limits will the power of attorney have
question: |
  What limits will the power of attorney have?
fields:
  - The attorneys-in-fact **CANNOT** make gifts to themselves, or transfer your assets to themselves or to someone they have a legal obligation to support: authority_gift_to_self
    datatype: noyes
    help: |
        Some Power of Attorney forms give Attorneys-in-Fact the power to transfer the Principal's property into their own names.

        You can limit this by refusing to grant this power.
  - label: |
      % if person_answering == "drafter":
      The attorney-in-fact must tell ${ users.familiar() } regularly how they spend their money and make decisions for them
      % else:
      The attorney-in-fact must tell me regularly how they spend my money and make decisions for me
      % endif
    field: attorney_must_provide_accounting
    datatype: yesno
    help: |
      Some Power of Attorney forms say the Attorney-in-Fact has to give regular "accountings" of any actions taken in the principal's name.
      
      This means that any time the Attorney-in-Fact acts for you, they have to give you an account that says what was done.
      
      This can be a good way to protect against abuse.
  - label: |
      Who should ${ attorneys.familiar() } send the reports about their decisions to?
    field: accounting_selection
    datatype: radio
    choices:
      - Myself only: myself_only
      - Someone else: someone_else
    show if: attorney_must_provide_accounting
  - label: | 
      List the name of the person(s) who should receive reportings.
      % if is_durable_poa:
      [BR]
      [BR]
      **Note**: because the power of attorney will last even if ${ users.familiar() } is
      unable to make their own decisions any longer, **you should name at least one
      other person** to get the reports.
      % endif
    field: accounting_goes_to # should I make this a name field instead of an open text box?
    datatype: area
    rows: 2
    help: |
      You can ask that accountings go solely to yourself or they could also go to someone like a trusted friend, family member, lawyer, or accountant.
      
      If someone else gets the accountings, it can be a good way to protect against abuse.
    label above field: True
    show if: 
      variable: accounting_selection
      is: someone_else
  - How often should ${ attorneys.familiar() } make their reports?: accounting_update_schedule
    help: |
      For example, every 6 months.
    datatype: area
    # should this be a picklist? LHI has 'monthly, quarterly, annual' as options.
    rows: 2
    show if: attorney_must_provide_accounting  
    label above field: True
continue button field: What_limits_will_the_power_of_attorney_have
